# Builds the landing page with scripts/media/build-site.sh and deploys it to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "fastlane/metadata/**"
      - "app/src/main/res/font/**"
      - "app/src/main/assets/licenses/**"
      - "media/**"
      - "scripts/media/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble _site
        run: bash scripts/media/build-site.sh --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
